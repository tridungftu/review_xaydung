<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng hồ sơ thanh toán – bản mẫu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2;--bg-nk:#EEF0EC;--card:#FFFFFF;--line:#DCDFD8;--line2:#ECEEE9;--soft:#FAFAF8;--soft2:#F1F2EF;
  --ink:#1A1D21;--ink2:#3A4048;--mute:#5A6068;--btnline:#C9CDC5;--field:#9AA0A8;
  --acc:#1D4E89;--acc-d:#123660;--acc-bg:#E2EAF5;--dark:#1A1D21;
  --ok:#0B5E33;--ok-bg:#E3F1E8;--warn:#7A4100;--warn-bg:#FBEBD0;--err:#9B1C14;--err-bg:#FADFDB;--err-row:#FFF8F7;--warn-row:#FFFAF0;--mute-bg:#ECEEE9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,sans-serif}
body.nk{background:var(--bg-nk)}
a{color:var(--acc)}a:hover{color:var(--acc-d)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
p{margin:0}
.sub{font-size:12px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* thanh vai */
.vai{background:#2B2F35;color:#E8EAE6;font-size:13px}
.vai .in{max-width:1400px;margin:0 auto;padding:6px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:#3A3F46;border-radius:8px;padding:3px;gap:3px}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:6px;background:transparent;color:#E8EAE6;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:var(--ink);font-weight:700}

/* đầu trang */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top.dark{background:var(--dark);color:#F4F5F2;border-bottom:0}
.top .in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:36px;height:36px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav button[aria-current="page"]{background:var(--acc-bg);color:var(--acc);font-weight:600}
.top.dark .nav button{color:#F4F5F2}
.top.dark .nav button[aria-current="page"]{background:#FFFFFF;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:#5BC98A;display:inline-block}
.stt{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px}
.top.dark .sub{color:#B9BEC4}

/* bố cục */
.wrap{max-width:1400px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.side{flex:1 1 260px;display:flex;flex-direction:column;gap:12px}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{flex:1 1 340px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.card.tight{padding:16px 20px;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.row.start{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink2)}

/* nút */
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--btnline);background:#FFFFFF;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#8A9099}
.btn.sm{min-height:36px;padding:0 12px;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#FFFFFF}
.btn.pri:hover{background:var(--acc-d)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#FFFFFF}
.btn.out{border-color:var(--acc);color:var(--acc)}
.btn.danger{color:var(--err)}
.btn:disabled{background:#E3E6E0;border-color:#E3E6E0;color:#4A5058;cursor:not-allowed}
.top.dark .btn{background:transparent;color:#F4F5F2;border-color:#4A5058}
.link{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;cursor:pointer;font:inherit}
.link.danger{color:var(--err)}

/* nhãn trạng thái */
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.err{background:var(--err-bg);color:var(--err)}
.info{background:var(--acc-bg);color:var(--acc)}.mute{background:var(--mute-bg);color:#454B52}

/* danh sách hồ sơ */
.qh{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase;margin-top:6px}
.hs{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);text-align:left;cursor:pointer;width:100%}
.hs[aria-current="true"]{border:2px solid var(--acc)}
.nk .hs[aria-current="true"]{border-color:var(--dark)}
.hs .t{font-weight:600}

/* bước */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.steps li{padding:10px 12px;border-radius:8px;background:var(--soft2);color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.steps li.done{background:var(--ok-bg);color:var(--ok)}
.steps li.cur{background:var(--acc);color:#FFFFFF}
.steps .s{font-size:12px}
.steps .n{font-weight:600}

/* ô số */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:14px;border-radius:10px;background:var(--soft);border:1px solid var(--line2);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* bảng */
.tbox{overflow-x:auto;border:1px solid var(--line2);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.e td{background:var(--err-row)}
.t tr.w td{background:var(--warn-row)}
.fl{display:flex;flex-direction:column;gap:6px}
.fi{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.note{margin-top:4px;font-size:13px}

/* nhóm danh mục */
.grp{display:flex;flex-direction:column;gap:8px}
.gh{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line2)}
.gh button{background:none;border:0;padding:6px 0;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-align:left}

/* vùng thả file */
.drop{border:2px dashed #9AA6B6;border-radius:12px;padding:26px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;background:#F7F9FC;text-align:center}
.drop.on{background:var(--acc-bg);border-color:var(--acc)}

/* thẻ tab */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--dark);color:#FFFFFF;font-weight:600}

.lop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lop>div{padding:16px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden}.bar>div{height:8px;background:var(--acc)}

/* phiếu */
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.item.open{border-color:var(--dark)}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--dark);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700}
.no.lt{background:var(--mute-bg);color:var(--ink)}
textarea,input[type=text],input[type=date],select{border:1px solid var(--field);border-radius:8px;background:#FFFFFF}
textarea{width:100%;padding:12px 14px;resize:vertical;line-height:1.6}
input[type=date],select{min-height:44px;padding:0 10px}
textarea.int{border-style:dashed;background:var(--soft)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--dark)}
.quote{padding:12px 14px;border-radius:10px;background:var(--soft2);line-height:1.6;white-space:pre-wrap}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chk li{display:flex;gap:10px;align-items:flex-start}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt.sel{border:2px solid var(--dark)}
.kv{display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr);gap:6px 16px;margin:0;padding:14px;border-radius:10px;background:var(--soft);border:1px solid var(--line2)}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--soft2);color:var(--ink2)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--acc-bg);color:var(--acc)}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--ink2)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#FFFFFF;padding:12px 18px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:min(560px,calc(100vw - 32px));z-index:10;display:none}
.toast.on{display:block}

/* biên bản in */
.bb{background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:40px;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px;font-size:14px}
.bb table{width:100%;border-collapse:collapse}.bb td,.bb th{border:1px solid #9AA0A8;padding:6px 8px;text-align:left;vertical-align:top}

@media (max-width:760px){
  .wrap{padding:16px;gap:16px}
  .vai .in,.top .in{padding:8px 16px}
  .card{padding:16px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles,.lop{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dd{margin-bottom:6px}
}
@media print{
  .no-print{display:none!important}
  body{background:#FFFFFF}
  .bb{border:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<div id="vai" class="vai no-print"></div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   BẢN MẪU GIAO DIỆN – chạy hoàn toàn trên trình duyệt.
   Không lưu dữ liệu, không gửi file đi đâu. Khi làm thật (giai đoạn 1),
   phần S (trạng thái) sẽ do máy chủ trên máy người ký cung cấp.
   ===================================================================== */

// ---------- tiện ích ----------
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tien = n => n == null ? 'chưa xác định' : n.toLocaleString('vi-VN') + ' đ';
const boDau = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const bayGio = () => { const d = new Date(); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const coKB = b => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
const IC = {
  up: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>',
  lock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  ok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5E33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M20 6 9 17l-5-5"/></svg>',
  warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A4100" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  file: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;align-self:center"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  chev: o => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(${o ? 90 : 0}deg)"><path d="m9 18 6-6-6-6"/></svg>`,
};

// ---------- danh mục hồ sơ (theo danh_muc_tai_lieu.csv) ----------
// [mã, nhóm, tên, bắt buộc, từ khoá nhận diện tên file]
const DM = [
  ['A01','A','Hợp đồng kèm điều kiện chung, điều kiện riêng',1,'hop dong|hdxd|hdepc|dieu kien chung|dieu kien rieng|contract'],
  ['A02','A','Bảng chi tiết giá trị hợp đồng (BOQ)',1,'boq|bang chi tiet gia tri|bang gia|don gia hop dong|bang khoi luong hop dong|bieu gia'],
  ['A03','A','Phụ lục hợp đồng',0,'phu luc|plhd|\\bpl\\d'],
  ['A04','A','Văn bản chấp thuận thay đổi, phát sinh',0,'chap thuan|phat sinh|de xuat thay doi'],
  ['A05','A','Hồ sơ dự thầu / báo giá, biên bản thương thảo',0,'du thau|bao gia|thuong thao|hsdt'],
  ['A06','A','Bảo lãnh (tạm ứng, thực hiện HĐ, bảo hành)',0,'bao lanh'],
  ['A07','A','Tiến độ thi công được duyệt',0,'tien do'],
  ['B01','B','Bản vẽ thi công được duyệt',1,'ban ve|bvtc|thiet ke|dwg'],
  ['B02','B','Bảng tính khối lượng thiết kế',0,'khoi luong thiet ke|kl thiet ke|thong ke khoi luong|bang tinh kl|tong hop kl'],
  ['B03','B','Bản vẽ hoàn công',0,'hoan cong|as built|bvhc'],
  ['B04','B','Hồ sơ thay đổi thiết kế, biên bản xử lý hiện trường',0,'thay doi thiet ke|xu ly ky thuat|hien truong'],
  ['C01','C','Biên bản nghiệm thu khối lượng hoàn thành đợt',1,'nghiem thu khoi luong|bb nghiem thu|bien ban nghiem thu|nghiem thu hoan thanh|bbnt'],
  ['C02','C','Biên bản xác nhận khối lượng và giá trị hoàn thành đợt',1,'xac nhan khoi luong|xac nhan gia tri|gia tri hoan thanh|xac nhan kl|bb xac nhan'],
  ['C03','C','Biên bản nghiệm thu công việc, vật liệu đầu vào',0,'nghiem thu cong viec|nghiem thu vat lieu|nghiem thu vat tu|bbnt cong viec'],
  ['C04','C','Nhật ký thi công',0,'nhat ky'],
  ['C05','C','Kết quả thí nghiệm, biên bản lấy mẫu',0,'thi nghiem|lay mau'],
  ['C06','C','Hình ảnh hiện trường có ngày chụp',0,'hinh anh|anh hien truong|photo|\\bimg'],
  ['D01','D','Biên bản giao nhận vật tư, thiết bị',0,'giao nhan|ban giao thiet bi|nhan hang'],
  ['D02','D','CO, CQ, packing list',0,'\\bco\\b|\\bcq\\b|chung nhan|packing'],
  ['D03','D','Biên bản lắp đặt, chạy thử',0,'lap dat|chay thu'],
  ['E01','E','Hồ sơ thanh toán đợt trước đã duyệt',1,'dot truoc|da duyet'],
  ['E02','E','Ủy nhiệm chi / sổ phụ ngân hàng',1,'uy nhiem chi|\\bunc\\b|so phu|sao ke|giay bao no'],
  ['E03','E','Hóa đơn GTGT',1,'hoa don|invoice|gtgt'],
  ['E04','E','Công văn / giấy đề nghị thanh toán đợt này',1,'de nghi thanh toan|giay dntt|cong van|\\bcv\\b'],
  ['E05','E','File Excel hồ sơ thanh toán đợt này',1,'hstt|ttkl|ho so thanh toan|thanh toan dot'],
  ['E06','E','Biên bản đối chiếu công nợ',0,'doi chieu cong no|cong no'],
  ['F01','F','Biên bản vi phạm chất lượng, tiến độ',0,'vi pham|phat|tam giu'],
  ['F02','F','Căn cứ thuế suất GTGT',0,'thue suat|giam thue'],
].map(([ma, nhom, ten, bb, tk]) => ({ma, nhom, ten, bb: !!bb, tk: tk.split('|'), apDung: nhom !== 'D'}));
const NHOM = {A:'A. Hợp đồng', B:'B. Thiết kế', C:'C. Nghiệm thu', D:'D. Vật tư, thiết bị', E:'E. Thanh toán', F:'F. Khác'};
const dm = ma => DM.find(d => d.ma === ma);

// nhận diện mục theo tên file: chọn từ khoá khớp dài nhất
function xepMuc(ten) {
  const s = ' ' + boDau(ten).replace(/[_\-.()\[\]]+/g, ' ') + ' ';
  const ext = ten.split('.').pop().toLowerCase();
  let best = null, dai = 0;
  for (const d of DM) {
    if (!d.apDung) continue;
    for (const k of d.tk) {
      let m; try { m = new RegExp(k).exec(s); } catch (e) { m = null; }
      if (m && m[0].length > dai) { best = d.ma; dai = m[0].length; }
    }
  }
  if (!best && ['jpg','jpeg','png','heic'].includes(ext)) best = 'C06';
  if (!best && ['dwg','dxf'].includes(ext)) best = 'B01';
  return best;
}

// kiểm tra hình thức sơ bộ (bản thật: máy chủ còn kiểm tra đọc được / scan / lỗi Excel)
const DUOI = ['pdf','xlsx','xlsm','xls','docx','doc','dwg','dxf','jpg','jpeg','png','heic','zip','rar'];
function kiemFile(f) {
  const ext = f.name.includes('.') ? f.name.split('.').pop().toLowerCase() : '';
  if (!DUOI.includes(ext)) return ['err', `Định dạng “.${ext || '?'}” không nhận. Nhận PDF, Excel, Word, DWG/DXF, ảnh, ZIP.`];
  if (f.size === 0) return ['err', 'File rỗng (0 byte).'];
  if (f.size > 300 * 1024 * 1024) return ['warn', 'File lớn hơn 300 MB.'];
  if (ext === 'doc' || ext === 'xls') return ['warn', `Định dạng cũ (.${ext}) – máy sẽ tự chuyển để đọc.`];
  return ['ok', 'Đã nhận. Máy kiểm tra tiếp: đọc được không, bản scan, lỗi file Excel.'];
}

function vNhom(g) {
  const ds = DM.filter(d => d.nhom === g);
  const mo = S.moNhom[g];
  const apDung = ds.some(d => d.apDung);
  const coFile = ds.filter(d => S.files.some(f => f.ma === d.ma)).length;
  const loi = ds.some(d => ttMuc(d)[0] === 'err' && d.apDung);
  const tom = !apDung ? '<span class="b mute">Không áp dụng cho hợp đồng này</span>'
    : `<span class="b ${loi ? 'err' : coFile ? 'ok' : 'mute'}">${coFile}/${ds.length} mục có file</span>`;
  const ghiChu = g === 'A' ? ' – dùng lại hồ sơ đã nộp ở đợt 1; chỉ nộp thêm khi có phụ lục mới' : g === 'D' ? ' – hợp đồng không có vật tư, thiết bị cung cấp riêng' : '';
  return `<div class="grp">
    <div class="gh"><button data-act="moNhom" data-v="${g}" aria-expanded="${mo}">${IC.chev(mo)}${NHOM[g]}<span class="sub" style="font-weight:400">${ghiChu}</span></button>${tom}</div>
    ${mo ? `<div class="tbox"><table class="t" style="min-width:880px"><colgroup><col style="width:56px"><col style="width:24%"><col style="width:84px"><col style="width:25%"><col><col style="width:116px"></colgroup>

      ${ds.map(vMuc).join('')}</tbody></table></div>` : ''}
  </div>`;
}

function vMuc(d) {
  const [c, t] = ttMuc(d);
  const fs = S.files.filter(f => f.ma === d.ma);
  const ghiChu = fs.filter(f => f.note && (f.kq !== 'ok' || !f.note.startsWith('Đã nhận')));
  return `<tr class="${c === 'err' && d.apDung ? 'e' : ''}">
    <td><strong>${d.ma}</strong></td><td>${esc(d.ten)}</td><td>${d.bb ? 'Có' : 'Không'}</td>
    <td>${fs.length ? `<div class="fl">${fs.map(f => `<div class="fi">${IC.file}<span>${esc(f.ten)}</span><span class="sub">${f.nguon === 'dot_truoc' ? 'nộp đợt trước' : coKB(f.size)}</span>
        ${f.nguon === 'nop' ? `<button class="link danger" data-act="xoaFile" data-id="${f.id}" aria-label="Gỡ ${esc(f.ten)}">Gỡ</button>` : ''}</div>`).join('')}</div>` : '<span class="sub">—</span>'}</td>
    <td><span class="b ${c}">${t}</span>${ghiChu.map(f => `<div class="note">${fs.length > 1 ? '<strong>' + esc(f.ten) + ':</strong> ' : ''}${esc(f.note)}</div>`).join('')}

    <td>${d.apDung ? `<label class="btn sm ${!fs.length || c === 'err' ? 'out' : ''}" style="position:relative">${fs.length ? (c === 'err' ? 'Thay file' : 'Thêm file') : 'Tải lên'}<input class="sr" type="file" multiple data-chg="taiMuc" data-ma="${d.ma}"></label>` : ''}</td>

}

        <div class="quote">${esc(it.gt.nd)}</div>
        <div class="row">${it.gt.files.length ? `<div class="row" style="justify-content:flex-start;gap:8px">${it.gt.files.map(n => `<span class="fi" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px">${IC.file}${esc(n)}</span>`).join('')}</div>` : '<span class="sub">Không đính kèm tài liệu</span>'}

function vPda() {

    ? `<div class="wrap">${vPdaSide()}<section class="main">${vNop()}</section></div>`
    : `<div class="wrap"><section class="main">${vPhanHoi()}</section><aside class="rail">${vPdaLs()}</aside></div>`;
  return vPdaTop() + `<main>${noi}</main>`;
}

function dinhTuyen() {
  const co = [
    ['HSTT_dot3.xlsx', 'Excel có công thức, 14 sheet', 'Đọc công thức và giá trị', 'Lớp 1 + Lớp 2', ['ok', 'Xong']],
    ['BBNT_dot3_scan.pdf', 'PDF ảnh scan, 6 trang, không có lớp chữ', 'OCR tiếng Việt', 'Module 3', ['ok', 'Xong']],
    ['CV_de_nghi_TT_dot3.pdf', 'PDF có lớp chữ', 'Đọc trực tiếp', 'Module 3', ['ok', 'Xong']],
    ['Nhat_ky_thang9.pdf', 'PDF có chữ nhưng phông TCVN3', 'Chuyển mã sang Unicode rồi đọc', 'Module 3', ['ok', 'Xong']],
    ['XL03_BVTC_rev2.dwg', 'Bản vẽ AutoCAD', 'Chuyển DXF, đọc lớp và kích thước', 'Module 4', ['info', 'Đang chạy']],
    ['XL03_BVTC_rev2.pdf', 'PDF xuất từ CAD, cùng bản với DWG', 'Không đọc lại, dùng DWG', '—', ['mute', 'Bỏ qua']],
    ['Anh_hien_truong_T9.zip', '24 ảnh JPG', 'Đọc ngày chụp', 'Module 3', ['mute', 'Chờ']],
  ];
  S.files.filter(f => f.nguon === 'nop' && f.id > 19).forEach(f => {
    const e = f.ten.split('.').pop().toLowerCase();
    const r = e === 'pdf' ? ['PDF – đang xem có lớp chữ hay bản scan', 'Đọc trực tiếp hoặc OCR', 'Module 3']
      : ['xlsx', 'xlsm', 'xls'].includes(e) ? ['Excel', 'Đọc công thức và giá trị', 'Lớp 1 + Lớp 2']
      : ['dwg', 'dxf'].includes(e) ? ['Bản vẽ AutoCAD', 'Chuyển DXF', 'Module 4']
      : ['jpg', 'jpeg', 'png', 'heic'].includes(e) ? ['Ảnh', 'Đọc ngày chụp; OCR nếu là biên bản chụp', 'Module 3']
      : ['Văn bản / nén', 'Giải nén hoặc đọc trực tiếp', 'Module 3'];
    co.push([f.ten + ' (mới)', ...r, ['mute', 'Chờ']]);
  });
  return co;
}

  </article>`;
}
function vCkTong() {
  const kt = dangChon().map(p => [p, kiemSo(p)]);

// =====================================================================
function vVai() {
  return `<div class="in"><span>Bản mẫu giao diện – chạy trên trình duyệt, chưa lưu dữ liệu, không gửi file đi đâu.</span>
    <div class="row" style="gap:10px"><span>Xem với vai:</span><div class="seg" role="group" aria-label="Chọn vai">
      <button data-act="vai" data-v="pda" aria-pressed="${S.vai === 'pda'}">Phòng dự án (máy trong LAN)</button>
      <button data-act="vai" data-v="nk" aria-pressed="${S.vai === 'nk'}">Người ký (máy anh)</button></div></div></div>`;
}
function ve() {
  document.getElementById('vai').innerHTML = vVai();
  document.getElementById('app').innerHTML = S.vai === 'pda' ? vPda() : vNk();
  ganDrop();
}

function themFile(list, maEp) {
  const moi = [];
  for (const f of list) {
    const [kq, note] = kiemFile(f);
    const ma = maEp || xepMuc(f.name);
    const o = {id: seq++, ma, ten: f.name, size: f.size, kq, note, nguon: 'nop', luc: bayGio()};
    S.files.push(o); moi.push(o);
  }
  if (!moi.length) return;
  // thay file lỗi của cùng mục khi nộp đè
  if (maEp) S.files = S.files.filter(f => !(f.ma === maEp && f.kq === 'err' && !moi.includes(f)));
  if (!maEp) S.vuaTai = moi.map(o => o.id).concat(S.vuaTai);
  const muc = [...new Set(moi.map(o => o.ma || 'chưa xếp'))].join(', ');
  ghi(`${S.trangThai === 'dang_nop' ? 'Nộp' : 'Nộp bổ sung'} ${moi.length} file (${muc})`);
  const loi = moi.filter(o => o.kq === 'err').length, chuaXep = moi.filter(o => !o.ma).length;
  bao(`Đã nhận ${moi.length} file${loi ? ' · ' + loi + ' file lỗi' : ''}${chuaXep ? ' · ' + chuaXep + ' file chưa xếp được mục' : ''}.`);
  ve();
}

function ganDrop() {
  const d = document.getElementById('drop');
  if (!d) return;
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('on'); });
  d.addEventListener('dragleave', () => d.classList.remove('on'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('on'); themFile([...e.dataTransfer.files]); });
}

const ACT = {
  vai: el => { S.vai = el.dataset.v; S.xemTruoc = false; S.bienBan = false; window.scrollTo(0, 0); ve(); },
  pdaTab: el => { S.pdaTab = el.dataset.v; window.scrollTo(0, 0); ve(); },
  nkTab: el => { S.nkTab = el.dataset.v; window.scrollTo(0, 0); ve(); },
  bao: el => bao(el.dataset.v),
  moNhom: el => { S.moNhom[el.dataset.v] = !S.moNhom[el.dataset.v]; ve(); },
  xoaVuaTai: () => { S.vuaTai = []; ve(); },
  xoaFile: el => { const id = +el.dataset.id; const f = S.files.find(x => x.id === id); S.files = S.files.filter(x => x.id !== id); S.vuaTai = S.vuaTai.filter(x => x !== id); ghi('Gỡ file ' + f.ten); ve(); },
  gui: () => { if (!tongHop().guiDuoc) return; S.trangThai = 'cho_kiem_tra'; ghi('Gửi hồ sơ – kiểm tra hình thức: Đạt, chuyển người ký'); bao('Đã gửi hồ sơ. Người ký sẽ kiểm tra số liệu.'); window.scrollTo(0, 0); ve(); },
  loc: el => { S.loc = +el.dataset.v; ve(); },
  xacNhan: el => { const p = ph(el.dataset.ma); p.xacNhan = true; ghi(p.ma + ': người ký xác nhận số OCR', false); bao('Đã xác nhận. Có thể đưa ' + p.ma + ' vào phiếu.'); ve(); },
  themPhieu: el => { ph(el.dataset.ma).chon = true; ve(); },
  boPhieu: el => { ph(el.dataset.ma).chon = false; ve(); },
  moItem: el => { PH.forEach(p => p.mo = false); ph(el.dataset.ma).mo = true; ve(); },
  dongItem: el => { ph(el.dataset.ma).mo = false; ve(); },
  khoiPhuc: el => { const p = ph(el.dataset.ma); p.nd = p.nhap; ve(); },
  xemTruoc: () => { S.xemTruoc = true; S.vai = 'pda'; S.pdaTab = 'phanhoi'; window.scrollTo(0, 0); ve(); },
  hetXemTruoc: () => { S.xemTruoc = false; S.vai = 'nk'; S.nkTab = 'phieu'; ve(); },
  xemNhuPda: () => { S.vai = 'pda'; S.pdaTab = 'phanhoi'; window.scrollTo(0, 0); ve(); },
  phatHanh: () => {
    const la = dangChon().filter(x => kiemSo(x).la.length);
    if (la.length) { bao('Chưa phát hành: ' + la.map(x => x.ma).join(', ') + ' có con số không có trong dữ liệu gốc.'); ve(); return; }
    const p = phieuNhap(); p.luc = bayGio();
    S.phieu.push(p); S.dangSoan = false;
    S.trangThai = p.ketLuan === 'du' ? 'du_dieu_kien' : 'da_phat_hanh';
    ghi(`Người ký phát hành phiếu ${p.so} (${p.items.length} nội dung) – ${KL_TEN[p.ketLuan]}`);
    bao(`Đã phát hành ${p.so}. Phòng dự án thấy ngay trên cổng.`); window.scrollTo(0, 0); ve();
  },
  soanTiep: () => { S.dangSoan = true; ve(); },
  suaGT: el => { const it = phieuMoi().items.find(i => i.ma === el.dataset.ma); S.nhapGT[it.ma] = {nd: it.gt.nd, files: [...it.gt.files], sua: true}; ve(); },
  guiGT: el => {
    const k = el.dataset.ma, n = S.nhapGT[k] || {nd: '', files: []};
    if (!n.nd.trim()) { bao('Nhập nội dung giải trình trước khi gửi.'); document.getElementById('gt-' + k)?.focus(); return; }
    const it = phieuMoi().items.find(i => i.ma === k);
    it.gt = {nd: n.nd.trim(), files: n.files, luc: bayGio()}; it.danhGia = null;
    delete S.nhapGT[k];
    ghi(`Giải trình nội dung ${k}${n.files.length ? ' kèm ' + n.files.length + ' tài liệu' : ''}`);
    bao('Đã gửi giải trình. Người ký nhận được ngay.'); ve();
  },
  danhGia: el => { const it = phieuMoi().items.find(i => i.ma === el.dataset.ma); it.danhGia = el.dataset.v; ghi(`${it.ma}: ${el.dataset.v === 'chap_nhan' ? 'chấp nhận' : 'chưa chấp nhận'} giải trình`, false); ve(); },
  bienBan: () => { S.bienBan = true; window.scrollTo(0, 0); ve(); },
  hetBienBan: () => { S.bienBan = false; ve(); },
  in: () => window.print(),
};
const CHG = {
  tai: el => { themFile([...el.files]); },
  taiMuc: el => { themFile([...el.files], el.dataset.ma); },
  doiMuc: el => { const f = S.files.find(x => x.id === +el.dataset.id); f.ma = el.value || null; ve(); },
  chon: el => { ph(el.dataset.ma).chon = el.checked; ve(); },
  yc: el => { ph(el.dataset.ma).yc = el.value; },
  han: el => { S.nhap.han = el.value; },
  hienTien: el => { S.nhap.hienTien = el.checked; ve(); },
  ketLuan: el => { S.nhap.ketLuan = el.value; ve(); },
  dinhKem: el => { const k = el.dataset.ma; S.nhapGT[k] = S.nhapGT[k] || {nd: '', files: []}; S.nhapGT[k].files.push(...[...el.files].map(f => f.name)); ve(); },
};
const INP = {
  nd: el => { const p = ph(el.dataset.ma); p.nd = el.value; const c = document.getElementById('ck-' + p.ma); if (c) c.innerHTML = vCk(kiemSo(p), p);
    const t = document.getElementById('ck-tong'); if (t) t.innerHTML = vCkTong(); },
  gc: el => { ph(el.dataset.ma).gc = el.value; },
  gt: el => { const k = el.dataset.ma; S.nhapGT[k] = S.nhapGT[k] || {nd: '', files: []}; S.nhapGT[k].nd = el.value; },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) ACT[el.dataset.act](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el) INP[el.dataset.inp](el, e); });

ve();
</script>
</body>
</html>
